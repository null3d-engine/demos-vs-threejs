name: Deploy

# Builds the demos and publishes them on Cloudflare Pages: `main` to the production site, each
# pull request to a preview address. public/_headers makes the pages cross-origin isolated there.
#
# It needs two repository secrets, CLOUDFLARE_API_TOKEN (with the Cloudflare Pages: Edit
# permission) and CLOUDFLARE_ACCOUNT_ID, and a Pages project named by the CLOUDFLARE_PAGES_PROJECT
# repository variable (default: null3d-vs-threejs). Without the secrets, for example on a pull
# request from a fork, the job only says so and passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  WRANGLER_VERSION: "4.143.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::The Cloudflare secrets are not set, so nothing is published."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - if: env.HAS_CLOUDFLARE == 'true'
        run: bun install --frozen-lockfile
      - if: env.HAS_CLOUDFLARE == 'true'
        run: bun run build
      - if: env.HAS_CLOUDFLARE == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'null3d-vs-threejs' }}
            --branch=${{ github.head_ref || github.ref_name }}
      - if: env.HAS_CLOUDFLARE == 'true'
        run: echo "::notice::Published at ${{ steps.deploy.outputs.deployment-url }}"
